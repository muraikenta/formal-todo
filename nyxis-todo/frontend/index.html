<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyxis Todo</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e2e0d8; --accent:#2f5d50; --danger:#a33; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif; }
  main { max-width:560px; margin:40px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  form { display:flex; gap:8px; }
  input[type=text], input[type=email] { flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button { padding:8px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button.del { background:transparent; color:var(--danger); padding:4px 8px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li .t { flex:1; cursor:text; }
  li.done .t { color:var(--muted); text-decoration:line-through; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .msg { font-size:13px; color:var(--muted); min-height:1.6em; margin-top:8px; }
  .msg.err { color:var(--danger); }
  .empty { color:var(--muted); font-size:13px; padding:8px 0; }
  code { font-size:12px; background:#eee; padding:1px 4px; border-radius:3px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Nyxis Todo</h1>
  <p class="sub">認可（他人の Todo に触れない）は Lean で証明済みのバックエンドが判定します。</p>

  <section id="login" class="card" hidden>
    <form id="email-form">
      <input id="email" type="email" placeholder="you@example.com" required>
      <button>コードを送る</button>
    </form>
    <form id="code-form" hidden style="margin-top:8px">
      <input id="code" type="text" inputmode="numeric" placeholder="メールの6桁コード" required>
      <button>ログイン</button>
    </form>
    <div id="login-msg" class="msg">ローカルのメールは Mailpit（<code>http://127.0.0.1:55324</code>）に届きます。</div>
  </section>

  <section id="app" hidden>
    <div class="card row">
      <span id="who" class="sub" style="margin:0"></span>
      <button id="logout" class="ghost">ログアウト</button>
    </div>
    <div class="card">
      <form id="new-form">
        <input id="new-title" type="text" placeholder="やること" required maxlength="200">
        <button>追加</button>
      </form>
      <ul id="list" style="margin-top:12px"></ul>
      <div id="app-msg" class="msg"></div>
    </div>
    <details class="card">
      <summary>他人の Todo を覗いてみる</summary>
      <form id="peek-form" style="margin-top:8px">
        <input id="peek-id" type="text" placeholder="Todo の ID" required>
        <button class="ghost">GET /todos/{id}</button>
      </form>
      <div id="peek-msg" class="msg"></div>
    </details>
  </section>
</main>
<script src="/config.js"></script>
<script>
const { apiUrl, supabaseUrl, anonKey } = window.TODO_CONFIG;
const $ = (id) => document.getElementById(id);
let session = JSON.parse(sessionStorage.getItem("todo-session") || "null");

function setMsg(el, text, err = false) { el.textContent = text; el.classList.toggle("err", err); }

async function auth(path, body) {
  const res = await fetch(supabaseUrl + "/auth/v1" + path, {
    method: "POST", headers: { apikey: anonKey, "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.msg || data.error_description || ("auth " + res.status));
  return data;
}

async function api(method, path, body) {
  const res = await fetch(apiUrl + path, {
    method,
    headers: { Authorization: "Bearer " + session.access_token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  return { status: res.status, text, json: () => JSON.parse(text) };
}

$("email-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await auth("/otp", { email: $("email").value, create_user: true });
    $("code-form").hidden = false;
    setMsg($("login-msg"), "コードを送りました。Mailpit で確認して入力してください。");
  } catch (err) { setMsg($("login-msg"), err.message, true); }
};

$("code-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    session = await auth("/verify", { type: "email", email: $("email").value, token: $("code").value.trim() });
    sessionStorage.setItem("todo-session", JSON.stringify(session));
    await enter();
  } catch (err) { setMsg($("login-msg"), err.message, true); }
};

$("logout").onclick = () => { sessionStorage.removeItem("todo-session"); session = null; show(); };

async function enter() {
  // 初回は自分の User 行を作る（201）。2回目以降は 409 になるので無視する。
  const reg = await api("POST", "/users/" + session.user.id, { name: session.user.email });
  if (![201, 409].includes(reg.status)) {
    if (reg.status === 403 || reg.status === 401) { $("logout").onclick(); setMsg($("login-msg"), "セッションが切れました。ログインし直してください。", true); return; }
  }
  show();
}

async function refresh() {
  const res = await api("GET", "/todos");
  if (res.status !== 200) { setMsg($("app-msg"), "一覧を取得できません (" + res.status + ")", true); return; }
  const todos = res.json().sort((a, b) => Number(a.done) - Number(b.done) || a.title.localeCompare(b.title));
  const list = $("list");
  list.innerHTML = "";
  if (!todos.length) list.innerHTML = '<li class="empty">まだ何もありません</li>';
  for (const t of todos) {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    const box = document.createElement("input");
    box.type = "checkbox"; box.checked = t.done;
    box.onchange = () => act("POST", `/todos/${t.id}/${box.checked ? "done" : "undone"}`);
    const title = document.createElement("span");
    title.className = "t"; title.textContent = t.title; title.title = "ダブルクリックで名前を変える / ID: " + t.id;
    title.ondblclick = () => {
      const next = prompt("新しいタイトル", t.title);
      if (next && next.trim()) act("PATCH", "/todos/" + t.id, { title: next });
    };
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "削除";
    del.onclick = () => act("DELETE", "/todos/" + t.id);
    li.append(box, title, del);
    list.append(li);
  }
  setMsg($("app-msg"), `${todos.filter(t => !t.done).length} 件残っています`);
}

async function act(method, path, body) {
  const res = await api(method, path, body);
  if (res.status >= 300) setMsg($("app-msg"), `${method} ${path} → ${res.status} ${res.text}`, true);
  await refresh();
}

$("new-form").onsubmit = async (e) => {
  e.preventDefault();
  const title = $("new-title").value;
  $("new-title").value = "";
  await act("POST", "/todos", { title });
};

$("peek-form").onsubmit = async (e) => {
  e.preventDefault();
  const res = await api("GET", "/todos/" + encodeURIComponent($("peek-id").value.trim()));
  setMsg($("peek-msg"), `${res.status} ${res.text}`, res.status !== 200);
};

function show() {
  $("login").hidden = !!session;
  $("app").hidden = !session;
  if (session) { $("who").textContent = session.user.email + " でログイン中"; refresh(); }
  else { $("code-form").hidden = true; }
}

if (session) enter(); else show();
</script>
</body>
</html>
