\* 別のタブで同じ URL を開く場合に、タブを閉じることを入れる。送信待ちが残ったタブを閉じると、その op を送るタブがもう無いので NoOpLost が破れる（既知の発見 3）
CONSTANTS
  Ids = {1}
  Titles = {"A", "B"}
  MaxOpNo = 2
  MaxPush = 3
  SecondTab = "new"
  CanReload = TRUE
  CanClose = TRUE
  StaleUI = FALSE
SPECIFICATION Spec
INVARIANTS AckedMeansApplied ClientOrderKept Converged NoOpLost
CHECK_DEADLOCK FALSE
