\* タブを複製したあと、どちらかのタブをリロードする場合。2 つのタブが同じ localStorage のキーに上書きし合うので、NoOpLost が破れる（既知の発見 2）
CONSTANTS
  Ids = {1}
  Titles = {"A", "B"}
  MaxOpNo = 2
  MaxPush = 3
  SecondTab = "duplicate"
  CanReload = TRUE
  CanClose = FALSE
  StaleUI = FALSE
SPECIFICATION Spec
INVARIANTS AckedMeansApplied ClientOrderKept Converged NoOpLost
CHECK_DEADLOCK FALSE
