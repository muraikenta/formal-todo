\* SyncTodo.cfg の画面の操作の条件を、古い描画のクロージャ（editingId で render が止まっている間）まで広げた版。重い（数百万〜千万状態）ので、render・act・イベントまわりを変えたときに回す。4 つとも成り立つはず
CONSTANTS
  Ids = {1}
  Titles = {"A", "B"}
  MaxOpNo = 2
  MaxPush = 3
  SecondTab = "new"
  CanReload = TRUE
  CanClose = FALSE
  StaleUI = TRUE
SPECIFICATION Spec
INVARIANTS AckedMeansApplied ClientOrderKept Converged NoOpLost
CHECK_DEADLOCK FALSE
