\* SyncTodo.cfg と同じで todo 2 件（Ids = {1, 2}）。todo をまたぐ不具合（lastSeq の進め方・pull の取りこぼし）は todo 1 件では原理的に出ないので、必ずこれも回す。4 つとも成り立つはず
CONSTANTS
  Ids = {1, 2}
  Titles = {"A", "B"}
  MaxOpNo = 2
  MaxPush = 2
  SecondTab = "new"
  CanReload = TRUE
  CanClose = FALSE
  StaleUI = FALSE
SPECIFICATION Spec
INVARIANTS AckedMeansApplied ClientOrderKept Converged NoOpLost
CHECK_DEADLOCK FALSE
