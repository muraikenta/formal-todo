\* タブを複製した場合（sessionStorage が写り、2 つのタブが同じクライアント ID になる）。リロード無し。AckedMeansApplied が破れる（既知の発見 1）
CONSTANTS
  Ids = {1}
  Titles = {"A", "B"}
  MaxOpNo = 2
  MaxPush = 3
  SecondTab = "duplicate"
  CanReload = FALSE
  CanClose = FALSE
  StaleUI = FALSE
SPECIFICATION Spec
INVARIANTS AckedMeansApplied ClientOrderKept Converged NoOpLost
CHECK_DEADLOCK FALSE
