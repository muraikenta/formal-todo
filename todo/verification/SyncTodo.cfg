\* 別のタブで同じ URL を開く場合（クライアント ID がタブごとに違う）・リロードあり。4 つの性質がすべて成り立つはず。todo 1 件
CONSTANTS
  \* todo の ID は 1 つだけ（todo 1 件）
  Ids = {1}
  \* 名前は "A" と "B" の 2 種類
  Titles = {"A", "B"}
  \* 各タブの操作は 2 回まで
  MaxOpNo = 2
  \* push は全タブ合計で 3 回まで
  MaxPush = 3
  \* 2 枚目は同じ URL を別タブで開く（"duplicate" なら複製）
  SecondTab = "new"
  \* リロードあり・タブを閉じるなし・古い画面からの操作なし
  CanReload = TRUE
  CanClose = FALSE
  StaleUI = FALSE
SPECIFICATION Spec
\* 全部の状態で確かめる 4 つの性質
INVARIANTS AckedMeansApplied ClientOrderKept Converged NoOpLost
\* 上限まで操作して止まった状態を、行き詰まり（エラー）と見なさない
CHECK_DEADLOCK FALSE
