<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sync Todo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Sync Todo</h1>
      <form id="new-form">
        <input id="new-title" placeholder="やることを入力して Enter" autocomplete="off" maxlength="500" />
        <button type="submit">追加</button>
      </form>
      <nav id="filters">
        <button data-filter="all">すべて</button>
        <button data-filter="active">未完了</button>
        <button data-filter="done">完了</button>
      </nav>
      <ul id="list"></ul>
      <footer>
        <span id="status"></span>
        <label><input type="checkbox" id="flaky" /> 不安定な回線を再現</label>
      </footer>
    </main>
    <script type="module" src="../src/app.ts"></script>
  </body>
</html>
