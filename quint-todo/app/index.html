<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quint Todo</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1d1d1f; --mute: #6b6b70; --line: #e4e2dc; --accent: #2f6f5e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --card: #202124; --ink: #ececee; --mute: #9a9aa0; --line: #333438; --accent: #6cc3a8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--mute); font-size: 13px; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .new { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .new button { border: 0; background: none; color: var(--mute); font-size: 18px; width: 48px; height: 52px; cursor: pointer; }
  .new input { flex: 1; border: 0; background: none; color: inherit; font: inherit; padding: 14px 16px 14px 0; outline: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--line); }
  li input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  li .title { flex: 1; word-break: break-word; cursor: text; }
  li.done .title { color: var(--mute); text-decoration: line-through; }
  li .edit { flex: 1; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  li .del { border: 0; background: none; color: var(--mute); font-size: 18px; cursor: pointer; opacity: .5; }
  li:hover .del, li .del:focus { opacity: 1; }
  footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; color: var(--mute); font-size: 13px; }
  .filters { display: flex; gap: 4px; }
  .filters button, .clear { border: 1px solid transparent; background: none; color: inherit; font: inherit; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .filters button[aria-pressed=true] { border-color: var(--line); color: var(--ink); }
  .clear[hidden], footer[hidden] { display: none; }
  .hint { color: var(--mute); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Todo</h1>
  <p class="sub">中身の決まりは Quint の仕様（todo.qnt）と突き合わせ済み</p>
  <div class="card">
    <form class="new" id="new">
      <button type="button" id="toggle-all" title="全部切り替え" aria-label="全部切り替え">❯</button>
      <input id="title" placeholder="やることを入力して Enter" autocomplete="off" autofocus>
    </form>
    <ul id="list"></ul>
    <footer id="footer">
      <span id="count"></span>
      <div class="filters" role="group" aria-label="表示">
        <button type="button" data-filter="all">すべて</button>
        <button type="button" data-filter="active">未完了</button>
        <button type="button" data-filter="done">完了</button>
      </div>
      <button type="button" class="clear" id="clear">完了済みを消す</button>
    </footer>
  </div>
  <p class="hint">ダブルクリックで編集（空欄にすると削除）</p>
</main>
<script type="module">
import { initialState, reduce, remaining } from "./todo-core.mjs";

const KEY = "quint-todo";
function load() {
  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && Array.isArray(saved.todos)) return saved; } catch {}
  return null;
}
let state = load() ?? initialState();
let filter = "all";
let editing = null; // { id, input } 編集中の項目

const $ = (id) => document.getElementById(id);
// IME の変換確定の Enter では確定しない（Safari は確定直後に isComposing=false・keyCode=229 で来る）
const isCommitEnter = (e) => e.key === "Enter" && !e.isComposing && e.keyCode !== 229;

function apply(action) {
  state = reduce(load() ?? state, action); // 別のタブが書いた最新の上に積む
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}
function dispatch(action) { apply(action); render(); }
// 編集中なら先に確定する（描き直しはしない。続く操作の dispatch でまとめて描く）
function commitEditing() {
  if (!editing) return;
  const { id, input } = editing;
  editing = null;
  apply({ type: "edit", id, title: input.value });
}
// 別のタブで変わったら読み直す
window.addEventListener("storage", (e) => { if (e.key === KEY) { state = load() ?? initialState(); if (!editing) render(); } });
// 編集中に一覧のチェックや × を押すと、blur の描き直しで押した要素が消えてクリックが届かない。
// mousedown でフォーカス移動を止め、click の中で「編集を確定 → その操作」の順に行う
const keepFocus = (el) => { el.onmousedown = (e) => { if (editing) e.preventDefault(); }; };

function render() {
  const list = $("list");
  list.replaceChildren();
  const shown = state.todos.filter((t) => filter === "all" || (filter === "done") === t.done);
  for (const t of shown) {
    const li = document.createElement("li");
    li.className = t.done ? "done" : "";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done; cb.ariaLabel = `${t.title} を完了にする`;
    keepFocus(cb);
    cb.onclick = (e) => { e.preventDefault(); commitEditing(); dispatch({ type: "toggle", id: t.id }); };
    li.append(cb);
    if (editing && editing.id === t.id) {
      const ed = editing.input ?? document.createElement("input");
      editing.input = ed;
      ed.className = "edit"; if (!ed.dataset.init) { ed.value = t.title; ed.dataset.init = "1"; }
      ed.onkeydown = (e) => {
        if (isCommitEnter(e)) { commitEditing(); render(); }
        if (e.key === "Escape") { editing = null; render(); }
      };
      ed.onblur = () => { if (editing && editing.input === ed) { commitEditing(); render(); } };
      li.append(ed);
      queueMicrotask(() => { ed.focus(); ed.select(); });
    } else {
      const span = document.createElement("span");
      span.className = "title"; span.textContent = t.title;
      span.ondblclick = () => { commitEditing(); editing = { id: t.id, input: null }; render(); };
      li.append(span);
    }
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.ariaLabel = `${t.title} を削除`;
    keepFocus(del);
    del.onclick = () => { const editingSelf = editing && editing.id === t.id; editing = editingSelf ? null : editing; commitEditing(); dispatch({ type: "remove", id: t.id }); };
    li.append(del);
    list.append(li);
  }
  const left = remaining(state);
  $("count").textContent = `残り ${left} 件`;
  $("footer").hidden = state.todos.length === 0;
  $("toggle-all").style.visibility = state.todos.length === 0 ? "hidden" : "visible";
  $("clear").hidden = state.todos.length === left;
  for (const b of document.querySelectorAll("[data-filter]")) b.ariaPressed = String(b.dataset.filter === filter);
}

$("new").onsubmit = (e) => e.preventDefault();
$("title").onkeydown = (e) => {
  if (!isCommitEnter(e)) return;
  e.preventDefault();
  dispatch({ type: "add", title: $("title").value });
  $("title").value = "";
};
$("toggle-all").onclick = () => dispatch({ type: "toggleAll" });
$("clear").onclick = () => dispatch({ type: "clearCompleted" });
for (const b of document.querySelectorAll("[data-filter]")) b.onclick = () => { filter = b.dataset.filter; render(); };
render();
</script>
</body>
</html>
