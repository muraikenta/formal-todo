[package]
name = "todo-server"
description = "The todo app's HTTP server, PostgreSQL store and browser UI"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
h5i-app-core = { workspace = true }
h5i-app-pg = { workspace = true }
h5i-app-http = { workspace = true }
h5i-app-json = { workspace = true }
todo-kernel = { path = "../kernel" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
