<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h5i Todo</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --mute:#77756f; --line:#e3e1da; --accent:#2f6f4f; --warn:#b4432f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --card:#21201d; --ink:#ecebe6; --mute:#9a978f; --line:#34322d; --accent:#7cc39c; --warn:#ef8a74; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "Hiragino Sans", system-ui, sans-serif; }
  main { max-width:560px; margin:40px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mute); font-size:13px; margin:0 0 20px; }
  .users { display:flex; gap:8px; margin-bottom:16px; }
  .users button { flex:1; padding:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; cursor:pointer; font:inherit; }
  .users button[aria-pressed=true] { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); font:inherit; }
  button.primary { padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  ul { list-style:none; margin:12px 0 0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  li .title { flex:1; cursor:text; overflow-wrap:anywhere; }
  li.done .title { color:var(--mute); text-decoration:line-through; }
  li .id { color:var(--mute); font-size:12px; font-variant-numeric:tabular-nums; }
  li button { border:0; background:none; color:var(--mute); cursor:pointer; font:inherit; }
  li button:hover { color:var(--warn); }
  .empty { color:var(--mute); padding:12px 0 0; }
  .msg { min-height:1.6em; margin:10px 0 0; font-size:13px; color:var(--warn); }
  details { margin-top:20px; }
  summary { cursor:pointer; color:var(--mute); font-size:13px; }
  .attack { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .attack input { width:80px; flex:none; }
  .attack button { padding:6px 10px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; cursor:pointer; font:inherit; }
  .note { color:var(--mute); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>h5i Todo</h1>
  <p class="sub">判断はすべて Rust のカーネル（Lean で証明済み）が下す。この画面は <code>POST /rpc</code> を呼ぶだけ。</p>
  <div class="users" id="users"></div>
  <div class="card">
    <form id="add"><input type="text" id="title" placeholder="やること（1〜140バイト）" autocomplete="off"><button class="primary">追加</button></form>
    <ul id="list"></ul>
    <p class="msg" id="msg" role="status"></p>
  </div>
  <details>
    <summary>他人の todo を触ってみる（id を指定して直接送る）</summary>
    <div class="attack">
      <input type="text" id="aid" placeholder="id" inputmode="numeric">
      <button data-cmd="set_done">完了にする</button>
      <button data-cmd="rename">名前を変える</button>
      <button data-cmd="delete">消す</button>
    </div>
    <p class="note">画面は自分の todo しか出さないが、id を直接送っても他人の todo なら <code>forbidden</code> が返る。カーネルの定理 <code>authorized_reachable</code>・<code>others_unchanged</code>・<code>list_own</code> がそれを全入力について保証している。</p>
  </details>
</main>
<script>
  // Tokens come in the URL fragment: #alice=<token>&bob=<token> (from run.sh).
  const tokens = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  const names = Object.keys(tokens);
  let who = names[0];
  const $ = (id) => document.getElementById(id);

  async function rpc(body) {
    const res = await fetch('/rpc', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + tokens[who] },
      body: JSON.stringify(body),
    });
    return res.json();
  }

  function say(r) { $('msg').textContent = r && r.error ? 'カーネルの返事: ' + r.error : ''; }

  async function refresh() {
    const todos = await rpc({ cmd: 'list' });
    const ul = $('list');
    ul.replaceChildren();
    if (!Array.isArray(todos) || todos.length === 0) {
      const p = document.createElement('li'); p.className = 'empty'; p.textContent = 'まだ何もない';
      ul.append(p); return;
    }
    for (const t of todos) {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.done;
      cb.onchange = async () => { say(await rpc({ cmd: 'set_done', id: t.id, done: cb.checked })); refresh(); };
      const title = document.createElement('span'); title.className = 'title'; title.textContent = t.title;
      title.title = 'ダブルクリックで名前を変える';
      title.ondblclick = async () => {
        const next = prompt('新しい名前', t.title);
        if (next !== null) { say(await rpc({ cmd: 'rename', id: t.id, title: next })); refresh(); }
      };
      const id = document.createElement('span'); id.className = 'id'; id.textContent = '#' + t.id;
      const del = document.createElement('button'); del.textContent = '削除'; del.setAttribute('aria-label', '削除');
      del.onclick = async () => { say(await rpc({ cmd: 'delete', id: t.id })); refresh(); };
      li.append(cb, title, id, del);
      ul.append(li);
    }
  }

  function renderUsers() {
    const box = $('users');
    box.replaceChildren();
    for (const n of names) {
      const b = document.createElement('button');
      b.textContent = n; b.setAttribute('aria-pressed', String(n === who));
      b.onclick = () => { who = n; say(null); renderUsers(); refresh(); };
      box.append(b);
    }
  }

  $('add').onsubmit = async (e) => {
    e.preventDefault();
    // Take the text and clear the field at once, so typing ahead does not merge into this title.
    const title = $('title').value;
    $('title').value = '';
    const r = await rpc({ cmd: 'add', title });
    say(r);
    if (r.error && !$('title').value) $('title').value = title;
    refresh();
  };

  for (const b of document.querySelectorAll('.attack button')) {
    b.onclick = async () => {
      const id = Number($('aid').value);
      const cmd = b.dataset.cmd;
      const body = cmd === 'set_done' ? { cmd, id, done: true } : cmd === 'rename' ? { cmd, id, title: 'hacked' } : { cmd, id };
      const r = await rpc(body);
      $('msg').textContent = 'カーネルの返事: ' + JSON.stringify(r);
      refresh();
    };
  }

  if (!who) { $('msg').textContent = 'トークンがない。run.sh が出す URL で開く。'; }
  else { renderUsers(); refresh(); }
</script>
</body>
</html>
