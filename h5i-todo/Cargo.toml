h5i-app-schema = { git = "https://github.com/h5i-dev/h5i", rev = "0226696ca1c12e929be2969ecd64fd46772ffd35" }
h5i-app-sql = { git = "https://github.com/h5i-dev/h5i", rev = "0226696ca1c12e929be2969ecd64fd46772ffd35" }
h5i-app-core = { git = "https://github.com/h5i-dev/h5i", rev = "0226696ca1c12e929be2969ecd64fd46772ffd35" }
h5i-app-pg = { git = "https://github.com/h5i-dev/h5i", rev = "0226696ca1c12e929be2969ecd64fd46772ffd35" }
h5i-app-http = { git = "https://github.com/h5i-dev/h5i", rev = "0226696ca1c12e929be2969ecd64fd46772ffd35" }
h5i-app-json = { git = "https://github.com/h5i-dev/h5i", rev = "0226696ca1c12e929be2969ecd64fd46772ffd35" }
